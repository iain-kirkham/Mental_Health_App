#spring.datasource.driver-class-name=org.postgresql.Driver


# Spring JPA Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


# Flyway settings
spring.flyway.enabled=true

# Fixed test-only master key (not a real secret) so encryption-dependent beans can start
# without requiring APP_MASTER_KEY to be set in the test environment.
app.encryption.master-key=pMHmcM5PPT/Boj0hGHHBHQhtzkVlO5dXh//UZGQNsmU=

# Logging levels
logging.level.org.testcontainers=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.github.dockerjava=DEBUG
logging.level.org.testcontainers.shaded.com.github.dockerjava=DEBUG
